name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # public/showcase/*/players/ is gitignored, so a fresh checkout has no
      # profiles and every test guarded by `requires_showcase` skips. Without
      # this step the explanation contract, the adapter boundary and the eval
      # gate reported nothing on a pull request while the job went green —
      # 54 tests on main, 384 after scoutlens-jtt.6.3. See scoutlens-iex.10.
      - name: Hydrate the showcase payload
        run: .github/scripts/hydrate-showcase.sh
      # And this is what keeps the step above from being dropped again: with it
      # set, an absent payload is a collection error naming the remedy, not a
      # silent skip.
      - run: uv run --frozen pytest -q
        env:
          SCOUTLENS_REQUIRE_SHOWCASE: "1"

  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src/scoutlens
      - run: uv build

  web-quality:
    runs-on: ubuntu-latest
    # Run in the same image contributors regenerate Linux baselines from
    # (`scoutlens-uze.23`).
    #
    # Before this, CI installed a browser onto `ubuntu-latest` while the
    # frontend contract §5.7 told contributors to regenerate inside
    # `v1.62.0-noble`. Two font environments, so the same page rendered one
    # monospace element differently in each — about 1,052 pixels, constant,
    # because it is one piece of text. Every Linux baseline therefore
    # disagreed slightly with whichever environment did not produce it, and
    # `maxDiffPixels` had to stay wide enough to swallow that. It is the only
    # reason the budget is 2,000 rather than a few hundred: run-to-run
    # variance on one machine is zero.
    #
    # **This image tag and `@playwright/test` in web/package.json must move
    # together.** The image ships the browsers for its own Playwright version;
    # bumping one alone gives a client/browser mismatch that will not
    # necessarily fail loudly.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    defaults:
      run:
        working-directory: web
        # Inside a container Actions falls back to `sh`, which is dash here, and
        # dash rejects `set -o pipefail`. On the plain runner the default was
        # already bash, so this keeps every `run` step behaving as it did rather
        # than changing two things at once.
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          # The visual-baseline pair guard diffs against the pull request
          # base, so a shallow single-commit checkout is not enough.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: .
      - name: Hydrate the showcase payload
        run: .github/scripts/hydrate-showcase.sh
        working-directory: .
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Visual baseline pair guard
        # A baseline updated on one platform is stale on the other, and the
        # stale side stays green locally, so nothing tells the author until CI
        # runs. Pull requests only: a push build has no base ref to diff and no
        # label to read, and must never silently take the override path.
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # TEMPORARY diagnostic (scoutlens-uze.23): the base SHA is reported as
          # inaccessible inside the container although git is present, the fetch
          # took every head, and safe.directory is configured. Measure rather
          # than guess.
          echo "--- whoami: $(id -u):$(id -g)  HOME=$HOME  PWD=$(pwd)"
          echo "--- workspace owner: $(stat -c '%u:%g' .)"
          echo "--- git version: $(git version)"
          echo "--- safe.directory: $(git config --get-all safe.directory || echo none)"
          echo "--- rev-list count: $(git rev-list --count HEAD 2>&1 | head -1)"
          echo "--- is the base present? $(git cat-file -t "$BASE_SHA" 2>&1 | head -1)"
          echo "--- origin/main: $(git rev-parse origin/main 2>&1 | head -1)"
          echo "--- refs: $(git for-each-ref --count=5 --format='%(refname)' | tr '
' ' ')"

          git diff --name-only "$BASE_SHA" HEAD > changed-paths.txt

          override=""
          if printf '%s' "$LABELS" | tr ',' '\n' | grep -Fxq 'visual-platform-specific'; then
            # The label alone is not sufficient. A reviewer must also say why, in
            # the pull request body, so the exception stays reviewable after the
            # fact instead of being a checkbox.
            if printf '%s' "$PR_BODY" | grep -qi 'platform-specific'; then
              echo 'Platform-specific override: label applied and a reason is documented in the body.'
              override='--allow-platform-specific'
            else
              echo '::error::The visual-platform-specific label is applied but the pull request body'
              echo '::error::does not explain why the difference is platform-specific. State the reason.'
              exit 1
            fi
          fi

          node web/scripts/check-visual-baseline-pairs.mjs --paths-from changed-paths.txt $override
      - run: pnpm contracts:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # No `playwright install` step: the image ships the browsers for its own
      # Playwright version, which is the whole point of running in it.
      - run: pnpm budget:check
      - run: pnpm test:e2e
      - run: pnpm lighthouse
      - name: Upload Playwright diagnostics
        # if: failure() so this runs precisely when it is needed. Without it a
        # red visual check reports a pixel ratio and nothing else, and the only
        # way to see the actual render is to reproduce the runner locally.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
          if-no-files-found: ignore
