name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest -q

  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src/scoutlens
      - run: uv build

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          # The visual-baseline pair guard diffs against the pull request
          # base, so a shallow single-commit checkout is not enough.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: .
      - run: uv run --frozen python -m scoutlens.showcase.payload hydrate
        working-directory: .
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Visual baseline pair guard
        # A baseline updated on one platform is stale on the other, and the
        # stale side stays green locally, so nothing tells the author until CI
        # runs. Pull requests only: a push build has no base ref to diff and no
        # label to read, and must never silently take the override path.
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > changed-paths.txt

          override=""
          if printf '%s' "$LABELS" | tr ',' '\n' | grep -Fxq 'visual-platform-specific'; then
            # The label alone is not sufficient. A reviewer must also say why, in
            # the pull request body, so the exception stays reviewable after the
            # fact instead of being a checkbox.
            if printf '%s' "$PR_BODY" | grep -qi 'platform-specific'; then
              echo 'Platform-specific override: label applied and a reason is documented in the body.'
              override='--allow-platform-specific'
            else
              echo '::error::The visual-platform-specific label is applied but the pull request body'
              echo '::error::does not explain why the difference is platform-specific. State the reason.'
              exit 1
            fi
          fi

          node web/scripts/check-visual-baseline-pairs.mjs --paths-from changed-paths.txt $override
      - run: pnpm contracts:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm budget:check
      - run: pnpm test:e2e
      - run: pnpm lighthouse
      - name: Upload Playwright diagnostics
        # if: failure() so this runs precisely when it is needed. Without it a
        # red visual check reports a pixel ratio and nothing else, and the only
        # way to see the actual render is to reproduce the runner locally.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
          if-no-files-found: ignore
